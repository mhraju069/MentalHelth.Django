<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ heading }}</title>
</head>

<body style="margin: 0; padding: 0; background-color: #F7F4F2;">
    <!-- Preview text shown in the inbox list -->
    <div style="display: none; max-height: 0; overflow: hidden;">Your Honeysuckle Trail code is {{ otp }}.</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F4F2">
        <tr>
            <td align="center" style="padding: 40px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 440px; background-color: #FFFFFF; border-radius: 16px;">
                    <tr>
                        <td align="center"
                            style="padding: 36px 32px 32px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #4B3425;">

                            <img src="{{ logo_src }}" alt="Honeysuckle Trail" width="88" height="88"
                                style="display: block; width: 88px; height: 88px; border: 0; margin: 0 auto 24px;">

                            <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 600; color: #4B3425;">
                                {{ heading }}</h1>
                            <p style="margin: 0 0 28px; font-size: 15px; line-height: 22px; color: #6D6661;">
                                {{ intro }}</p>

                            <div
                                style="font-size: 32px; font-weight: 600; letter-spacing: 8px; color: #4B3425; background-color: #F7F4F2; border-radius: 12px; padding: 14px 0 14px 8px; font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;">
                                {{ otp }}</div>

                            <p style="margin: 16px 0 0; font-size: 13px; color: #8F8985;">
                                This code expires in {{ expires_minutes }} minutes.</p>

                            <p style="margin: 28px 0 0; font-size: 13px; line-height: 20px; color: #8F8985;">
                                If you didn't request this, you can ignore this email.</p>
                        </td>
                    </tr>
                </table>

                <p
                    style="margin: 20px 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; color: #A09791;">
                    Honeysuckle Trail · Honeysuckle Co. LLC</p>
            </td>
        </tr>
    </table>
</body>

</html>
